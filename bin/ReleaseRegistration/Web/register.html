<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Create an account for the Wonderland Online private server.">
    <title>Create account - Wonderland Online</title>
    <link rel="stylesheet" href="/register.css">
    <script src="/register.js" defer></script>
</head>
<body>
    <main class="card">
        <p class="eyebrow">WONDERLAND ONLINE</p>
        <h1>Create your account</h1>
        <p class="intro">Join the adventure. Choose your game login details below.</p>

        <form id="registration-form">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" minlength="4" maxlength="14"
                   pattern="[A-Za-z0-9_]{4,14}" autocomplete="username" required>
            <p class="hint">4-14 characters: letters, numbers, and underscores.</p>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="4" maxlength="14"
                   autocomplete="new-password" required>

            <label for="password-confirm">Confirm password</label>
            <input id="password-confirm" name="passwordConfirm" type="password" minlength="4" maxlength="14"
                   autocomplete="new-password" required>

            <button type="submit">Create account</button>
            <p id="form-message" class="message" role="status" aria-live="polite"></p>
        </form>

        <p class="footer">This server snapshot may need additional setup before the game is playable.</p>
    </main>
</body>
</html>
